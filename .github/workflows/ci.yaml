name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          # Resolving "3.x" hits the GitHub API; without a token the call is
          # unauthenticated and gets rate-limited on shared runner IPs, which
          # returns an HTML error page the action tries to unpack as a binary.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task fetch-spec

      - run: task test
